<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1132 Remover - Zoom Data Cleaner</title>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <div class="header">
    <h1>1132 REMOVER</h1>
    <p>Zoom Data Cleaner &amp; System Reset Tool</p>
    <p class="version" id="versionText">v2.1.0</p>
  </div>

  <div class="container">
    <!-- Options Panel -->
    <div class="options-panel">
      <div class="options-title">Reset Options</div>
      <div class="option-row">
        <label class="toggle-switch">
          <input type="checkbox" id="optUninstall" checked>
          <span class="toggle-slider"></span>
        </label>
        <div class="option-label">
          Uninstall Zoom
          <span>Remove Zoom application before reset</span>
        </div>
      </div>
      <div class="option-row">
        <label class="toggle-switch">
          <input type="checkbox" id="optReinstall" checked>
          <span class="toggle-slider"></span>
        </label>
        <div class="option-label">
          Reinstall Zoom
          <span>Download and install fresh copy after reset</span>
        </div>
      </div>
    </div>

    <div class="button-row">
      <button id="quickResetBtn" class="btn btn-purple">FULL RESET (NO USER CHANGE)</button>
    </div>
    <div class="button-row">
      <button id="createUserBtn" class="btn btn-primary">CREATE ZOOM USER</button>
      <button id="deleteUserBtn" class="btn btn-danger">DELETE ZOOM USER</button>
    </div>
    <div class="button-row">
      <button id="launchBtn" class="btn btn-success" disabled>LAUNCH ZOOM AS USER</button>
    </div>
    <div id="fileList" class="file-list">
      <div class="file-item">Ready. Click a button to begin.</div>
    </div>
  </div>

  <div class="status-bar">
    <span id="statusText" class="status-text">Waiting for action...</span>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
