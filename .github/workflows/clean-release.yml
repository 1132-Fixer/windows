# 1132 Fixer — Release Asset Cleanup
# Runs after a release is published to the Releases repo.
# Removes incidental assets (checksums.txt, source archives) while
# PRESERVING auto-updater assets (latest.yml + *.blockmap) by default.
#
# To wipe ALL non-.exe assets (will break auto-update — use only for
# old releases you've moved off of), trigger manually with
# `delete_updater_assets: true`.
#
# SETUP: Requires RELEASES_PAT secret with Contents:write on
#   PrimeUpYourLife/1132-Fixer-Windows-Releases

name: Clean Release Assets

on:
  # Run manually after publishing a release
  workflow_dispatch:
    inputs:
      delete_updater_assets:
        description: 'ALSO delete latest.yml and *.blockmap (BREAKS auto-update!)'
        required: false
        type: boolean
        default: false
  # Auto-run every 30 min to catch new publishes.
  # Cron runs always preserve updater assets (the input default applies).
  schedule:
    - cron: '*/30 * * * *'

jobs:
  clean:
    runs-on: ubuntu-latest

    steps:
      - name: Clean release assets
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASES_PAT }}
          script: |
            const owner = 'PrimeUpYourLife';
            const repo = '1132-Fixer-Windows-Releases';
            // Default: keep latest.yml + *.blockmap (needed for electron-updater).
            // Cron triggers send no inputs, so `${{ inputs.delete_updater_assets }}`
            // evaluates to '' → false → updater assets preserved.
            const deleteUpdaterAssets = '${{ inputs.delete_updater_assets }}' === 'true';

            // Get latest release
            let release;
            try {
              const { data } = await github.rest.repos.getLatestRelease({ owner, repo });
              release = data;
            } catch (e) {
              console.log('No releases found, skipping.');
              return;
            }

            console.log(`Release: ${release.tag_name} — ${release.name}`);
            console.log(`Assets: ${release.assets.length}`);
            console.log(`Preserving updater assets: ${!deleteUpdaterAssets}`);

            let deleted = 0;
            let kept = 0;

            for (const asset of release.assets) {
              const name = asset.name.toLowerCase();
              const isExe = name.endsWith('.exe');
              const isYml = name === 'latest.yml';
              const isBlockmap = name.endsWith('.blockmap');
              const isUpdaterAsset = isYml || isBlockmap;

              // Always keep: .exe files. Conditionally keep: updater assets.
              if (isExe || (isUpdaterAsset && !deleteUpdaterAssets)) {
                console.log(`  ✓ KEEP: ${asset.name} (${(asset.size / 1024 / 1024).toFixed(1)} MB)`);
                kept++;
              } else {
                console.log(`  ✗ DELETE: ${asset.name}`);
                await github.rest.repos.deleteReleaseAsset({
                  owner, repo,
                  asset_id: asset.id
                });
                deleted++;
              }
            }

            // Ensure this release is flagged "Latest".
            //
            // NOTE: this block used to also send `exclude_source_code_archives: true`
            // and log "Source code archives hidden." That was a false success.
            // GitHub has NO way to hide the auto-generated "Source code" zip/tar.gz
            // archives — no API parameter, no repo setting, no checkbox. It is a
            // long-standing, still-unimplemented feature request:
            //   https://github.com/orgs/community/discussions/6003
            // The REST API silently ignores unknown body fields and returns 200, so
            // the call always "succeeded" while doing nothing, and the try/catch
            // never fired. Verified: the release object has no such field.
            //
            // Mitigation instead lives in release.yml, which puts a Download table
            // at the top of the release notes telling users which .exe to take and
            // to ignore the Source code links.
            try {
              await github.request('PATCH /repos/{owner}/{repo}/releases/{release_id}', {
                owner, repo,
                release_id: release.id,
                make_latest: 'true'
              });
              console.log('Release marked as latest.');
            } catch (e) {
              console.log('Note: could not mark release as latest — ' + e.message);
            }

            console.log(`\nDone: kept ${kept}, deleted ${deleted}`);

            if (deleted === 0) {
              console.log('Release already clean — no changes needed.');
            }
