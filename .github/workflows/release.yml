# 1132 Fixer - Immutable release draft preparation
# Triggered when a version tag is pushed (e.g., v5.6.1)
#
# Releases from this repository are currently UNSIGNED: no CSC_LINK or
# CSC_KEY_PASSWORD secret is configured, and no certificate has been purchased.
# The "Check signature state" step below records that fact on every release and
# blocks the combinations that would break the update channel.
#
# Read docs/security/code-signing.md before changing anything signing-related.
# In particular, do not set verifyUpdateCodeSignature to true until a release
# actually produces validly signed artifacts — that flag is evaluated by the
# version already installed on a user's machine, so enabling it early breaks
# updates permanently for everyone running that version.
#
# Full chain: docs/development/release-process.md

name: Prepare release draft

on:
  push:
    tags:
      - 'v*'

# Serialize ALL release runs (any tag) so an accidental rerun of an old tag
# can't race the current tag's release upload.
concurrency:
  group: release-pipeline
  cancel-in-progress: false

env:
  # Disable code signing auto-discovery (we control this explicitly)
  CSC_IDENTITY_AUTO_DISCOVERY: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and validate unpublished draft
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Validate tag format
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 7) { throw 'PowerShell 7 is required' }
          if ($env:RELEASE_TAG -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Only stable vX.Y.Z tags are supported by the current update channel'
          }

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Extract version from tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $package = Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json
          $lock = Get-Content -LiteralPath package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          if ($package.version -cne $version -or $lock['version'] -cne $version -or $lock['packages']['']['version'] -cne $version) {
            throw 'Tag, package and lock versions must agree'
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install dependencies
        run: npm ci
        env:
          # Reduce flakiness on Windows runners
          npm_config_prefer_offline: true

      - name: Install dependencies (retry on failure)
        if: failure()
        run: |
          npm cache clean --force
          npm ci

      - name: Build all targets
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Public feedback proxy endpoint — NOT a secret. The GitHub token now
          # lives server-side in feedback-proxy/, so no credential is ever baked
          # into a build. Optional: when unset, the build still succeeds and the
          # feedback form reports "not configured". See src/main/config.js.
          FEEDBACK_PROXY_URL: ${{ vars.FEEDBACK_PROXY_URL }}
        run: |
          # Unset empty CSC_LINK so electron-builder doesn't try to resolve it as a file
          if ([string]::IsNullOrEmpty($env:CSC_LINK)) {
            Remove-Item Env:CSC_LINK -ErrorAction SilentlyContinue
            Remove-Item Env:CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
          }
          # Bake the feedback token into src/main/config.generated.js from the
          # env var above. This workflow calls electron-builder directly rather
          # than `npm run build`, so the inject step must be invoked explicitly.
          node scripts/inject-config.js
          # -p never: this workflow handles release creation via action-gh-release;
          # electron-builder's own publish would race it and duplicate the release.
          npx electron-builder --win --x64 -p never

      # Updater metadata. Strips the isAdminRightsRequired flag electron-builder
      # writes for per-machine installers (this package ships no elevate.exe,
      # so clients 6.3.1–6.3.3 could not install with it) and proves the
      # version, installer name, size and SHA-512 in latest.yml match the
      # bytes in dist/ and the tag being released. See
      # docs/development/updater-channel.md.
      - name: Finalize updater metadata
        shell: pwsh
        run: |
          node scripts/finalize-update-metadata.mjs --dist dist --expect-version "${{ steps.version.outputs.VERSION }}"

      - name: Verify build artifacts exist
        shell: pwsh
        run: |
          $exeFiles = Get-ChildItem -Path dist -Filter "*.exe" -ErrorAction SilentlyContinue
          $exeCount = ($exeFiles | Measure-Object).Count

          Write-Host "Found $exeCount executable(s) in dist/"
          $exeFiles | ForEach-Object { Write-Host "  - $($_.Name)" }

          if ($exeCount -lt 2) {
            Write-Error "Build verification failed: Expected at least 2 .exe files (installer + portable), found $exeCount"
            exit 1
          }

          # Verify expected files exist
          $hasInstaller = $exeFiles | Where-Object { $_.Name -like "*Setup*" }
          $hasPortable = $exeFiles | Where-Object { $_.Name -like "*Portable*" }

          if (-not $hasInstaller) {
            Write-Error "Missing installer executable (*Setup*.exe)"
            exit 1
          }
          if (-not $hasPortable) {
            Write-Error "Missing portable executable (*Portable*.exe)"
            exit 1
          }

          Write-Host "Build verification passed"

      # checksums-sha256.txt in coreutils format — LF, UTF-8 without BOM,
      # sorted, final LF — written by the repository's own generator and then
      # read back as bytes. The former PowerShell step piped the list through a
      # cmdlet that writes CRLF on Windows, so `sha256sum -c` failed on every
      # line of the published manifest (releases up to 6.3.3). The same script
      # runs in ci.yml on every push, and validate-release-assets.mjs checks
      # the file as attached to the release.
      - name: Generate checksums
        shell: pwsh
        run: |
          node scripts/generate-checksums.mjs --dist dist
          node scripts/generate-checksums.mjs --verify --dist dist

      - name: Verify executable checksum bytes
        working-directory: dist
        run: |
          foreach ($line in Get-Content -LiteralPath checksums-sha256.txt) {
            if ($line -cnotmatch '^([0-9a-f]{64})  ([A-Za-z0-9._-]+\.exe)$') { throw 'Invalid executable checksum entry' }
            $expected = $Matches[1]
            $fileName = $Matches[2]
            if ((Get-FileHash -LiteralPath $fileName -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected) { throw 'Executable checksum mismatch' }
          }

      # What actually ships, enumerated and checked against
      # build/package-allowlist.json. Fails on an unexpected executable,
      # script, key, database or archive. See docs/security/BINARY-POLICY.md.
      - name: Package inventory and allowlist
        shell: pwsh
        run: |
          node scripts/package-inventory.mjs --unpacked dist/win-unpacked

      # Records the true Authenticode state of what was just built, and refuses
      # to publish the combinations that break the update channel. Runs BEFORE
      # the release is created so a refusal means nothing shipped.
      # See docs/security/code-signing.md.
      - name: Check signature state
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          node scripts/check-signature-state.mjs --dist dist

      # SPDX bill of materials. Runs after the inventory so shipped binaries
      # that electron-builder fetches outside the lockfile are included with
      # their real hashes.
      - name: Generate SBOM
        shell: pwsh
        run: |
          node scripts/generate-sbom.mjs --out dist/sbom.spdx.json

      # Build record. Runs last so it hashes every artifact, including the SBOM.
      # This is metadata, not an attestation — see the script header.
      - name: Generate provenance
        shell: pwsh
        run: |
          node scripts/generate-provenance.mjs --dist dist

      - name: List release artifacts
        shell: pwsh
        run: |
          Write-Host "=== Release Artifacts ==="
          Get-ChildItem -Path dist | Format-Table Name, Length, LastWriteTime

      - name: Capture immutable upload manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          FEEDBACK_PROXY_URL: ${{ vars.FEEDBACK_PROXY_URL }}
        run: |
          node scripts/create-release-manifest.mjs --dist dist --tag "$env:RELEASE_TAG" --source "$env:SOURCE_SHA" --out release-upload-manifest.json
          if ($LASTEXITCODE -ne 0) { throw 'Immutable upload manifest failed' }

      - name: Refuse existing release before creating a draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $guard = @'
          const tag=process.env.RELEASE_TAG;
          if(!/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(tag))throw Error('Invalid stable tag');
          const response=await fetch('https://api.github.com/repos/1132-Fixer/windows/releases/tags/'+encodeURIComponent(tag),{
            headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+process.env.GITHUB_TOKEN},
            signal:AbortSignal.timeout(30000),redirect:'error'});
          if(response.status!==404)throw Error('Release already exists or its absence is unverified; preserve and reconcile it instead of overwriting');
          '@
          node --input-type=module -e $guard
          if ($LASTEXITCODE -ne 0) { throw 'New-release admission failed' }

      # This workflow deliberately leaves a draft. Publishing requires the
      # separate exact-source/review/asset/native qualification gate. A green
      # build or --test-copy packaged run cannot authorize public delivery.
      - name: Create unpublished GitHub draft
        id: draft
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: 1132 Fixer v${{ steps.version.outputs.VERSION }}
          tag_name: v${{ steps.version.outputs.VERSION }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: false
          make_latest: false
          overwrite_files: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          # Prepended above the auto-generated notes.
          body: |
            ## Download

            | File | Use this one if |
            |---|---|
            | **1132-Fixer-Setup-${{ steps.version.outputs.VERSION }}.exe** | **Most people.** Standard installer — adds Start Menu / desktop shortcuts and enables auto-update. |
            | **1132-Fixer-Portable-${{ steps.version.outputs.VERSION }}.exe** | You want no install — just run it. |

            Right-click → **Run as administrator**. Requires Windows 10/11 with Zoom Workplace installed machine-wide.

            ---
          files: |
            dist/1132-Fixer-Setup-${{ steps.version.outputs.VERSION }}.exe
            dist/1132-Fixer-Portable-${{ steps.version.outputs.VERSION }}.exe
            dist/checksums-sha256.txt
            dist/latest.yml
            dist/1132-Fixer-Setup-${{ steps.version.outputs.VERSION }}.exe.blockmap
            dist/signature-state.json
            dist/package-inventory.json
            dist/sbom.spdx.json
            dist/provenance.json

      - name: Validate identified draft assets before publication
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Named explicitly. The script's defaults used to be this repository's
          # former name, which resolved only through GitHub's rename redirect.
          RELEASES_OWNER: ${{ github.repository_owner }}
          RELEASES_REPO: ${{ github.event.repository.name }}
          RELEASE_TAG: ${{ github.ref_name }}
          DRAFT_ID: ${{ steps.draft.outputs.id }}
        run: |
          node scripts/validate-release-assets.mjs "$env:RELEASE_TAG" --mode draft --release-id "$env:DRAFT_ID" --manifest release-upload-manifest.json
          if ($LASTEXITCODE -ne 0) { throw 'Draft asset verification failed; keep the draft unpublished' }

      # Convenience copy only. The release is still an unpublished draft;
      # this upload does not establish native or installed acceptance.
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        continue-on-error: true
        with:
          name: release-v${{ steps.version.outputs.VERSION }}
          path: |
            dist/*.exe
            dist/checksums-sha256.txt
          retention-days: 30
