# 1132 Fixer — Aggregate User Ratings
# Reads all issues labeled "user-rating", computes averages,
# and pushes ratings.json to the public releases repo for
# a live shields.io badge.
#
# SETUP: Add a RELEASES_PAT secret with Contents:write on
#   PrimeUpYourLife/1132-Fixer-Windows-Releases

name: Aggregate Ratings

on:
  issues:
    types: [opened, edited, labeled]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  issues: read

jobs:
  aggregate:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       contains(github.event.issue.labels.*.name, 'user-rating'))

    steps:
      - name: Compute ratings
        id: ratings
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'user-rating',
              state: 'all',
              per_page: 100
            });

            const ratings = [];
            const regex = /<!-- RATING_DATA:(\{.*?\}) -->/;

            for (const issue of issues) {
              const match = issue.body?.match(regex);
              if (match) {
                try {
                  const data = JSON.parse(match[1]);
                  ratings.push({ date: issue.created_at, ...data });
                } catch (e) {}
              }
            }

            if (ratings.length === 0) {
              const empty = JSON.stringify({
                schemaVersion: 1,
                label: "Rating",
                message: "no reviews yet",
                color: "lightgrey"
              }, null, 2);
              core.setOutput('json', empty);
              return;
            }

            const sum = { ease: 0, resolved: 0, recommend: 0, overall: 0 };
            const cnt = { ease: 0, resolved: 0, recommend: 0, overall: 0 };

            for (const r of ratings) {
              for (const k of ['ease','resolved','recommend','overall']) {
                if (r[k] > 0) { sum[k] += r[k]; cnt[k]++; }
              }
            }

            const filledTotal = cnt.ease + cnt.resolved + cnt.recommend + cnt.overall;
            const sumTotal = sum.ease + sum.resolved + sum.recommend + sum.overall;
            const combined = filledTotal > 0 ? (sumTotal / filledTotal).toFixed(1) : '0.0';
            const c = parseFloat(combined);

            const result = {
              schemaVersion: 1,
              label: "Rating",
              message: `${combined}/5 (${ratings.length} reviews)`,
              color: c >= 4.5 ? "brightgreen" : c >= 3.5 ? "green" : c >= 2.5 ? "yellow" : "red"
            };

            core.setOutput('json', JSON.stringify(result, null, 2));

      - name: Push to releases repo
        env:
          PAT: ${{ secrets.RELEASES_PAT }}
          DATA: ${{ steps.ratings.outputs.json }}
        run: |
          git clone https://x-access-token:${PAT}@github.com/PrimeUpYourLife/1132-Fixer-Windows-Releases.git repo
          cd repo
          echo "$DATA" > ratings.json
          git config user.name "1132-Fixer Bot"
          git config user.email "bot@noreply.github.com"
          git add ratings.json
          git diff --cached --quiet || (git commit -m "Update user ratings [bot]" && git push)
