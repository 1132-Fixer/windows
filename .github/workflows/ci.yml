# 1132 Fixer - Continuous Integration
# Runs on every push and PR to validate builds

name: CI

on:
  push:
    branches: [main]
  # No base-branch filter. Filtering to main meant a pull request stacked on
  # another pull request got no CI at all, so the change that most needs
  # verification — one built on top of unreviewed work — was the one that
  # shipped unverified.
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  support:
    # This name is required by the Windows repository ruleset. Keep the
    # desktop/service contract gate after the backend moved to its own repo.
    name: Support Service
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install desktop test dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci
      - name: Verify stateless support submission boundary
        run: node tools/support-submission-smoke.js
      - name: Verify support release readiness contract
        run: node tools/support-release-smoke.js

  build:
    name: Build & Test
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      # submodules: true — tools/design-sync-pin-smoke.js proves the pinned
      # design-system commit is fetchable from a clean checkout and that the
      # app's tokens match the recorded Windows overlay at that pin.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        # tools/updater-channel-smoke.js reads GitHub release metadata; the
        # unauthenticated API rate limit is shared by every runner and
        # returned 403 mid-run. The token is read-only here.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm test

      - name: Build portable executable
        env:
          FEEDBACK_PROXY_URL: ${{ vars.FEEDBACK_PROXY_URL }}
        run: npm run build

      - name: Build NSIS installer
        env:
          FEEDBACK_PROXY_URL: ${{ vars.FEEDBACK_PROXY_URL }}
        run: npm run build:installer

      # Updater metadata as release.yml will publish it: no
      # isAdminRightsRequired flag, and version / installer name / size /
      # SHA-512 in latest.yml proven against the bytes in dist/.
      - name: Finalize updater metadata
        run: node scripts/finalize-update-metadata.mjs --dist dist

      # Packaged-build diagnostic acceptance. This non-interactive run drives
      # a manifest-modified asInvoker copy, so it cannot establish native
      # elevation or final-artifact release eligibility. Zoom Workplace is
      # installed first so Fix now can still drive the real repair orchestrator;
      # if that download fails the driver still runs and reports the fix
      # journey as not-run rather than passed. See tools/packaged-acceptance.js.
      - name: Install Zoom Workplace for the acceptance run
        continue-on-error: true
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'ZoomInstallerFull.msi'
          Invoke-WebRequest -Uri 'https://zoom.us/client/latest/ZoomInstallerFull.msi?archType=x64' -OutFile $msi -TimeoutSec 300
          $p = Start-Process msiexec.exe -ArgumentList @('/i', $msi, '/qn', '/norestart') -Wait -PassThru
          Write-Host "msiexec exit $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          Get-ChildItem 'C:\Program Files\Zoom\bin\Zoom.exe' -ErrorAction SilentlyContinue | Select-Object FullName, Length

      # --test-copy: non-interactive automation does not exercise the shipped
      # requireAdministrator launch or an operator's UAC choice. The driver
      # stamps a throwaway copy asInvoker and drives that; dist/win-unpacked
      # and the installers are untouched and the report records which binary
      # ran.
      - name: Packaged acceptance (launch, states, keyboard, scaling, Fix now)
        run: node tools/packaged-acceptance.js --exe "dist/win-unpacked/1132 Fixer.exe" --out acceptance-evidence --test-copy --artifact-head "${{ github.event.pull_request.head.sha || github.sha }}" --expected-head "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Upload packaged acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packaged-acceptance
          path: acceptance-evidence/
          retention-days: 30

      # package.json "files" is a broad glob with a deny list, so what ships
      # depends on what is in the working tree at build time. This enumerates
      # the real payload and fails on an unexpected executable, script, key,
      # database or archive. See docs/security/BINARY-POLICY.md.
      - name: Package inventory and allowlist
        run: node scripts/package-inventory.mjs --unpacked dist/win-unpacked

      # These three are exercised here as well as at release time, so a broken
      # generator surfaces on a pull request rather than mid-release. Kept as
      # separate steps deliberately: pwsh only propagates the last command's
      # exit code, so chaining them would mask a failure in the first two.
      - name: Check signature state
        run: node scripts/check-signature-state.mjs --dist dist

      - name: Generate SBOM
        run: node scripts/generate-sbom.mjs --out dist/sbom.spdx.json

      - name: Generate provenance
        run: node scripts/generate-provenance.mjs --dist dist

      # The release checksum manifest, produced by the same generator and on
      # the same runner image release.yml uses, then read back as bytes and
      # verified with the standard tool without any preprocessing. Uploaded
      # with the two executables so the published-shape file can be checked
      # from a download, not only from the workspace. See
      # scripts/generate-checksums.mjs and tools/release-checksums-smoke.js.
      - name: Generate release checksum manifest
        run: |
          node scripts/generate-checksums.mjs --dist dist
          node scripts/generate-checksums.mjs --verify --dist dist

      - name: Verify checksum manifest with sha256sum
        shell: bash
        working-directory: dist
        run: sha256sum -c checksums-sha256.txt

      # The tag workflow reuses these exact bytes. It never rebuilds after the
      # native Setup/Portable acceptance manifest has bound their hashes.
      - name: Record exact release candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/release-candidate.mjs --dist dist --head "${{ github.sha }}"

      - name: Upload exact release candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-candidate-${{ github.sha }}
          path: |
            dist/*Setup*.exe
            dist/*Portable*.exe
            dist/checksums-sha256.txt
            dist/latest.yml
            dist/*.blockmap
            dist/signature-state.json
            dist/package-inventory.json
            dist/sbom.spdx.json
            dist/provenance.json
            dist/release-candidate.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload release checksum manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-checksums
          path: dist/checksums-sha256.txt
          retention-days: 7

      - name: List build artifacts
        run: |
          echo "=== Build Output ==="
          dir dist

      # These exact-head executables are inputs to the separate native Windows
      # acceptance gate. A green build must not hide that their upload failed.
      - name: Upload portable artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: 1132-Fixer-Portable
          path: dist/*Portable*.exe
          retention-days: 7

      - name: Upload installer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: 1132-Fixer-Installer
          path: dist/*Setup*.exe
          retention-days: 7

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Check tracked JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z -- '*.js' '*.cjs' '*.mjs' | xargs -0 -r -n1 node --check
