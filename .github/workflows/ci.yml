# 1132 Fixer - Continuous Integration
# Runs on every push and PR to validate builds

name: CI

on:
  push:
    branches: [main]
  # No base-branch filter. Filtering to main meant a pull request stacked on
  # another pull request got no CI at all, so the change that most needs
  # verification — one built on top of unreviewed work — was the one that
  # shipped unverified.
  pull_request:

jobs:
  build:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run feedback-proxy tests
        run: node feedback-proxy/test.js

      - name: Build portable executable
        run: npm run build

      - name: Build NSIS installer
        run: npm run build:installer

      # Packaged-build acceptance. The runner is an elevated Windows session
      # without Smart App Control, so the unsigned host binary can start here
      # (it cannot on a SAC-enforcing operator machine). Zoom Workplace is
      # installed first so Fix now can drive the real repair orchestrator;
      # if that download fails the driver still runs and reports the fix
      # journey as not-run rather than passed. See tools/packaged-acceptance.js.
      - name: Install Zoom Workplace for the acceptance run
        continue-on-error: true
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'ZoomInstallerFull.msi'
          Invoke-WebRequest -Uri 'https://zoom.us/client/latest/ZoomInstallerFull.msi?archType=x64' -OutFile $msi -TimeoutSec 300
          $p = Start-Process msiexec.exe -ArgumentList @('/i', $msi, '/qn', '/norestart') -Wait -PassThru
          Write-Host "msiexec exit $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          Get-ChildItem 'C:\Program Files\Zoom\bin\Zoom.exe' -ErrorAction SilentlyContinue | Select-Object FullName, Length

      # --test-copy: GitHub-hosted runners have UAC disabled, and with UAC off
      # Windows will not CreateProcess a requireAdministrator image from the
      # Chromium sandbox's restricted token (renderer/GPU launch fails,
      # SBOX_ERROR_CREATE_PROCESS = 18). The driver therefore stamps a
      # throwaway copy asInvoker and drives that; dist/win-unpacked and the
      # installers are untouched and the report records which binary ran.
      - name: Packaged acceptance (launch, states, keyboard, scaling, Fix now)
        run: node tools/packaged-acceptance.js --exe "dist/win-unpacked/1132 Fixer.exe" --out acceptance-evidence --test-copy

      - name: Upload packaged acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: packaged-acceptance
          path: acceptance-evidence/
          retention-days: 30

      # package.json "files" is a broad glob with a deny list, so what ships
      # depends on what is in the working tree at build time. This enumerates
      # the real payload and fails on an unexpected executable, script, key,
      # database or archive. See docs/security/BINARY-POLICY.md.
      - name: Package inventory and allowlist
        run: node scripts/package-inventory.mjs --unpacked dist/win-unpacked

      # These three are exercised here as well as at release time, so a broken
      # generator surfaces on a pull request rather than mid-release. Kept as
      # separate steps deliberately: pwsh only propagates the last command's
      # exit code, so chaining them would mask a failure in the first two.
      - name: Check signature state
        run: node scripts/check-signature-state.mjs --dist dist

      - name: Generate SBOM
        run: node scripts/generate-sbom.mjs --out dist/sbom.spdx.json

      - name: Generate provenance
        run: node scripts/generate-provenance.mjs --dist dist

      - name: List build artifacts
        run: |
          echo "=== Build Output ==="
          dir dist

      # Debug conveniences only. Actions artifact storage is a quota-limited
      # bucket shared across the account; when it fills up, these uploads fail.
      # That must not red a build whose compile + tests actually passed.
      - name: Upload portable artifact
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: 1132-Fixer-Portable
          path: dist/*Portable*.exe
          retention-days: 7

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: 1132-Fixer-Installer
          path: dist/*Setup*.exe
          retention-days: 7

  support-service:
    name: Support Service
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fixer_support_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # npm ci: the service holding the DB credential and bot token builds
      # from the committed lockfile, not from a fresh resolve.
      - name: Install feedback-proxy dependencies
        working-directory: feedback-proxy
        run: npm ci --no-audit --no-fund

      - name: Framework suite (Postgres-backed)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/fixer_support_test
        run: node feedback-proxy/test-framework.js

      # DATABASE_URL deliberately unset here: proves the dark-deploy guarantee —
      # the refactored server must behave exactly like the legacy proxy.
      - name: Legacy suite (no DATABASE_URL)
        run: node feedback-proxy/test.js

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for security issues in dependencies
        run: npm audit --audit-level=high
        continue-on-error: true  # Advisory only
