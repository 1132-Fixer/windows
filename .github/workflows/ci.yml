# 1132 Fixer - Continuous Integration
# Runs on every push and PR to validate builds

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main, fix/styling]

jobs:
  build:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run feedback-proxy tests
        run: node feedback-proxy/test.js

      - name: Build portable executable
        run: npm run build

      - name: Build NSIS installer
        run: npm run build:installer

      - name: List build artifacts
        run: |
          echo "=== Build Output ==="
          dir dist

      # Debug conveniences only. Actions artifact storage is a quota-limited
      # bucket shared across the account; when it fills up, these uploads fail.
      # That must not red a build whose compile + tests actually passed.
      - name: Upload portable artifact
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: 1132-Fixer-Portable
          path: dist/*Portable*.exe
          retention-days: 7

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: 1132-Fixer-Installer
          path: dist/*Setup*.exe
          retention-days: 7

  support-service:
    name: Support Service
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fixer_support_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install feedback-proxy dependencies
        working-directory: feedback-proxy
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Framework suite (Postgres-backed)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/fixer_support_test
        run: node feedback-proxy/test-framework.js

      # DATABASE_URL deliberately unset here: proves the dark-deploy guarantee —
      # the refactored server must behave exactly like the legacy proxy.
      - name: Legacy suite (no DATABASE_URL)
        run: node feedback-proxy/test.js

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for security issues in dependencies
        run: npm audit --audit-level=high
        continue-on-error: true  # Advisory only
