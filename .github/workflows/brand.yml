name: Brand guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  brand-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # design-system is private; DESIGN_SYSTEM_TOKEN is a read-only token
      # scoped to that repository and is not persisted into git config.
      - name: Fetch design-system submodule
        shell: bash
        env:
          DESIGN_SYSTEM_TOKEN: ${{ secrets.DESIGN_SYSTEM_TOKEN }}
        run: |
          auth=$(printf 'x-access-token:%s' "$DESIGN_SYSTEM_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" submodule update --init --depth=1
      - name: Check shipped brand assets
        shell: bash
        run: |
          test -s design-system/scripts/brand-assets.sh || { echo "design-system submodule is missing or empty" >&2; exit 1; }
          design-system/scripts/brand-assets.sh check . .brand-assets.tsv
