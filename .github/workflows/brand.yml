name: Brand guard

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: brand-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  brand-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Fetch pinned private design-system
        env:
          DESIGN_SYSTEM_DEPLOY_KEY: ${{ secrets.DESIGN_SYSTEM_DEPLOY_KEY }}
          DESIGN_SYSTEM_TOKEN: ${{ secrets.DESIGN_SYSTEM_TOKEN }}
        run: node .github/scripts/fetch-design-system.js
      - name: Check shipped brand assets
        shell: bash
        run: |
          test -s design-system/scripts/brand-assets.sh || { echo "design-system submodule is missing or empty" >&2; exit 1; }
          design-system/scripts/brand-assets.sh check . .brand-assets.tsv
