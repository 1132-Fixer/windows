# Dependabot clones this repository with the required design-system submodule.
# Keep its pin reachable; AGENTS.md describes the brand guard and pin contract.

version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Stockholm"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels: ["dependencies", "github-actions"]
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Stockholm"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels: ["dependencies", "npm"]

  - package-ecosystem: "npm"
    directory: "/feedback-proxy"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Stockholm"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels: ["dependencies", "npm"]
