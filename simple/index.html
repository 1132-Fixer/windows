<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>1132 Quick Reset</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    .header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #333;
      background: rgba(0, 0, 0, 0.3);
    }

    .header h1 {
      font-size: 24px;
      font-weight: 600;
      color: #00d4ff;
      text-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
    }

    .header p {
      font-size: 12px;
      color: #888;
      margin-top: 5px;
    }

    .version {
      font-size: 11px;
      color: #00d4ff;
      opacity: 0.7;
      margin-top: 3px;
    }

    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 15px;
    }

    .btn {
      width: 100%;
      padding: 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #9933ff 0%, #7a29cc 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(153, 51, 255, 0.3);
    }

    .btn:hover:not(:disabled) {
      background: linear-gradient(135deg, #aa44ff 0%, #9933ff 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(153, 51, 255, 0.4);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .progress-list {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid #333;
      border-radius: 8px;
      padding: 15px;
      overflow-y: auto;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 13px;
      min-height: 250px;
    }

    .step-item {
      padding: 6px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .step-item:last-child {
      border-bottom: none;
    }

    .step-item.done {
      color: #00ff88;
    }

    .step-item.running {
      color: #ffaa00;
    }

    .step-item.pending {
      color: #666;
    }

    .step-item.error {
      color: #ff4444;
    }

    .step-item.header {
      color: #00d4ff;
      font-weight: bold;
      margin-top: 10px;
    }

    .status-bar {
      padding: 15px 20px;
      background: rgba(0, 0, 0, 0.4);
      border-top: 1px solid #333;
      text-align: center;
    }

    .status-text {
      font-size: 13px;
      color: #888;
    }

    .status-text.success {
      color: #00ff88;
    }

    .status-text.error {
      color: #ff4444;
    }

    .status-text.loading {
      color: #ffaa00;
    }

    .progress-list::-webkit-scrollbar {
      width: 8px;
    }

    .progress-list::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 4px;
    }

    .progress-list::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>1132 QUICK RESET</h1>
    <p>Reset Zoom & Reinstall Automatically</p>
    <p class="version">v2.1.0</p>
  </div>

  <div class="container">
    <button id="resetBtn" class="btn">RESET & REINSTALL ZOOM</button>
    <div id="progressList" class="progress-list">
      <div class="step-item">Click the button to reset Zoom completely.</div>
      <div class="step-item">This will:</div>
      <div class="step-item">  1. Kill all Zoom processes</div>
      <div class="step-item">  2. Uninstall Zoom</div>
      <div class="step-item">  3. Delete ALL Zoom data</div>
      <div class="step-item">  4. Clean registry & services</div>
      <div class="step-item">  5. Download fresh Zoom</div>
      <div class="step-item">  6. Reinstall & Launch Zoom</div>
    </div>
  </div>

  <div class="status-bar">
    <span id="statusText" class="status-text">Ready</span>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
