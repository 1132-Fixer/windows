<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>1132 Remover</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --card: #1a1a1a;
      --card-hover: #222;
      --border: #2a2a2a;
      --accent: #e53935;
      --accent-hover: #f44336;
      --success: #4caf50;
      --text: #fafafa;
      --text-secondary: #888;
      --text-muted: #555;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header - Draggable */
    .header {
      background: var(--card);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      -webkit-app-region: drag;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
    }

    .logo-text {
      font-size: 18px;
      font-weight: 600;
    }

    .logo-text span {
      color: var(--accent);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: var(--bg);
      border-radius: 20px;
      font-size: 12px;
      color: var(--text-secondary);
      -webkit-app-region: no-drag;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
    }

    .status-dot.running {
      background: var(--accent);
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
    }

    /* Main Content */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 24px;
      gap: 20px;
      overflow: hidden;
    }

    /* Action Card */
    .action-card {
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      border: 1px solid var(--border);
    }

    .action-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .action-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .action-desc {
      font-size: 13px;
      color: var(--text-muted);
    }

    .btn-reset {
      padding: 14px 32px;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      color: white;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-reset:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(229, 57, 53, 0.3);
    }

    .btn-reset:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-reset svg {
      width: 18px;
      height: 18px;
    }

    /* Options Grid */
    .options-grid {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }

    .option-item {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      padding: 8px 0;
    }

    .option-item:hover .option-checkbox {
      border-color: var(--accent);
    }

    .option-checkbox {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .option-checkbox.checked {
      background: var(--accent);
      border-color: var(--accent);
    }

    .option-checkbox svg {
      width: 12px;
      height: 12px;
      color: white;
      opacity: 0;
    }

    .option-checkbox.checked svg {
      opacity: 1;
    }

    .option-label {
      font-size: 14px;
      color: var(--text);
    }

    .option-hint {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Progress Section */
    .progress-section {
      display: none;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .progress-section.active {
      display: block;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .progress-label {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .progress-percent {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
    }

    .progress-bar {
      height: 6px;
      background: var(--bg);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #ff7043);
      border-radius: 3px;
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Log Section */
    .log-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 120px;
      max-height: 200px;
    }

    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .log-title {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .log-actions {
      display: flex;
      gap: 8px;
    }

    .btn-icon {
      width: 28px;
      height: 28px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      background: var(--card-hover);
      color: var(--text);
      border-color: var(--text-muted);
    }

    .btn-icon svg {
      width: 14px;
      height: 14px;
    }

    .log-container {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .log-content {
      height: 100%;
      overflow-y: auto;
      padding: 12px 16px;
      font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
      font-size: 12px;
      line-height: 1.7;
      user-select: text;
      cursor: text;
    }

    .log-content::-webkit-scrollbar {
      width: 8px;
    }

    .log-content::-webkit-scrollbar-track {
      background: transparent;
    }

    .log-content::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    .log-content::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    .log-entry {
      padding: 2px 0;
      display: flex;
      gap: 8px;
    }

    .log-time {
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .log-msg { color: var(--text-secondary); }
    .log-msg.ok { color: var(--success); }
    .log-msg.err { color: var(--accent); }
    .log-msg.info { color: #64b5f6; }

    .log-empty {
      color: var(--text-muted);
      font-style: italic;
    }

    /* Complete View */
    .complete-view {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
      flex: 1;
    }

    .complete-view.active {
      display: flex;
    }

    .complete-icon {
      width: 80px;
      height: 80px;
      background: rgba(76, 175, 80, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .complete-icon svg {
      width: 40px;
      height: 40px;
      color: var(--success);
    }

    .complete-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--success);
    }

    .complete-msg {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 32px;
    }

    .complete-actions {
      display: flex;
      gap: 12px;
    }

    .btn-secondary {
      padding: 12px 24px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-secondary:hover {
      background: var(--card-hover);
      border-color: var(--text-muted);
    }

    .btn-primary {
      padding: 12px 24px;
      background: var(--success);
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      color: white;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary:hover {
      filter: brightness(1.1);
    }

    /* Footer */
    .footer {
      padding: 12px 24px;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
    }

    .footer a {
      color: var(--text-secondary);
      text-decoration: none;
    }

    .footer a:hover {
      color: var(--text);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">
      <div class="logo-icon">Z</div>
      <div class="logo-text"><span>1132</span> Remover</div>
    </div>
    <div class="status-badge">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Ready</span>
    </div>
  </header>

  <main class="main">
    <div id="normalView">
      <!-- Action Card -->
      <div class="action-card">
        <div class="action-header">
          <div>
            <div class="action-title">Zoom Reset Tool</div>
            <div class="action-desc">Removes Zoom completely and wipes device fingerprint to fix Error 1132</div>
          </div>
          <button class="btn-reset" id="btnReset">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
              <path d="M3 3v5h5"/>
            </svg>
            Reset Zoom
          </button>
        </div>

        <div class="options-grid">
          <label class="option-item">
            <div class="option-checkbox checked" id="chkUninstall" data-option="uninstall">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            </div>
            <div>
              <div class="option-label">Uninstall Zoom first</div>
              <div class="option-hint">Run official uninstaller before cleanup</div>
            </div>
          </label>

          <label class="option-item">
            <div class="option-checkbox checked" id="chkReinstall" data-option="reinstall">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            </div>
            <div>
              <div class="option-label">Reinstall after</div>
              <div class="option-hint">Download fresh copy from zoom.us</div>
            </div>
          </label>

          <label class="option-item">
            <div class="option-checkbox" id="chkLaunch" data-option="launch">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            </div>
            <div>
              <div class="option-label">Launch when done</div>
              <div class="option-hint">Open Zoom after installation</div>
            </div>
          </label>
        </div>

        <div class="progress-section" id="progressSection">
          <div class="progress-header">
            <span class="progress-label" id="progressLabel">Starting...</span>
            <span class="progress-percent" id="progressPercent">0%</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>
      </div>

      <!-- Log Section -->
      <div class="log-section">
        <div class="log-header">
          <span class="log-title">Activity Log</span>
          <div class="log-actions">
            <button class="btn-icon" id="btnCopyLog" title="Copy log">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2"/>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
              </svg>
            </button>
            <button class="btn-icon" id="btnClearLog" title="Clear log">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 6h18"/>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
                <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              </svg>
            </button>
            <button class="btn-icon" id="btnOpenLogs" title="Open log folder">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="log-container">
          <div class="log-content" id="logContent">
            <div class="log-empty">Ready to start. Select options above and click Reset Zoom.</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Complete View -->
    <div class="complete-view" id="completeView">
      <div class="complete-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
      </div>
      <h2 class="complete-title">Reset Complete</h2>
      <p class="complete-msg" id="completeMsg">Zoom has been reset and reinstalled successfully.</p>
      <div class="complete-actions">
        <button class="btn-secondary" id="btnStartOver">Start Over</button>
        <button class="btn-primary" id="btnLaunchZoom">Launch Zoom</button>
      </div>
    </div>
  </main>

  <footer class="footer">
    <span>v2.0.0</span>
    <span id="adminStatus">Checking privileges...</span>
  </footer>

  <script src="renderer.js"></script>
</body>
</html>
