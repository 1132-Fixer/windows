<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; script-src 'self';">
  <title>1132 Fixer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-top: #0a1020;
      --bg-bot: #050a14;
      --accent: #f5a623;
      --accent-hot: #ff8c00;
      --accent-glow: rgba(245, 166, 35, 0.5);
      --green: #22c55e;
      --green-glow: rgba(34, 197, 94, 0.35);
      --red: #ef4444;
      --text: #f0f0f0;
      --text-dim: #8ca4c0;
      --metal: #3a4a5e;
      --hazard-yellow: #f5c518;
      --hazard-black: #1a1a1a;
    }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(170deg, var(--bg-top) 0%, #081018 40%, var(--bg-bot) 100%);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 30% 20%, rgba(245,166,35,0.04) 0%, transparent 60%),
                  radial-gradient(ellipse at 70% 80%, rgba(26,111,181,0.05) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* ===== HEADER ===== */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 24px 0;
      position: relative;
      z-index: 1;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 8px;
      -webkit-app-region: no-drag;
    }
    .logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .logo img {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      filter: drop-shadow(0 8px 28px rgba(0,0,0,0.8));
    }
    .logo-title {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 3px;
      line-height: 1;
      background: linear-gradient(180deg, #ffe066, #ffd700, #f5a623);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 8px rgba(245,166,35,0.6));
      text-align: center;
    }
    .logo-sep {
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, var(--accent-hot), var(--accent));
      border-radius: 2px;
    }
    .logo-desc {
      color: var(--text-dim);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.5px;
    }

    /* ===== MAIN ===== */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px 24px;
      position: relative;
      z-index: 1;
      -webkit-app-region: no-drag;
      overflow: hidden;
    }

    /* ===== FILE LIST ===== */
    .file-list {
      flex: 1;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 12px 16px;
      overflow-y: auto;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 12px;
    }
    .file-list::-webkit-scrollbar { width: 8px; }
    .file-list::-webkit-scrollbar-track { background: transparent; }
    .file-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
    .file-list::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    .file-item { padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
    .file-item:last-child { border-bottom: none; }
    .file-item.header { color: var(--accent); font-weight: bold; font-size: 12px; }
    .file-item.error { color: var(--red); }
    .file-item.success { color: var(--green); }
    .file-item.failed { color: var(--red); }
    .file-item.empty-line { padding: 3px 0; border: none; }
    .file-item.loading { color: var(--accent); text-align: center; padding: 20px; font-size: 13px; animation: pulse 1.5s ease-in-out infinite; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

    /* ===== BUTTONS ===== */
    .button-container {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 8px;
    }

    .btn-delete {
      padding: 12px 32px;
      border-radius: 28px;
      border: 2px solid rgba(255,255,255,0.15);
      cursor: pointer;
      background: linear-gradient(145deg, #ffd700, #f5c518, #e8a800);
      color: #1a1a1a;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 3px;
      box-shadow: 0 0 30px rgba(245,197,24,0.25), 0 4px 16px rgba(0,0,0,0.4);
      transition: all 0.3s ease;
    }
    .btn-delete:hover:not(:disabled) {
      transform: scale(1.04);
      box-shadow: 0 0 50px rgba(245,197,24,0.4), 0 6px 24px rgba(0,0,0,0.5);
    }
    .btn-delete:active:not(:disabled) { transform: scale(0.97); }
    .btn-delete:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-refresh {
      padding: 12px 24px;
      border-radius: 28px;
      border: 1px solid rgba(255,255,255,0.12);
      background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-refresh:hover { background: rgba(255,255,255,0.1); color: var(--text); transform: translateY(-2px); }

    /* ===== STATUS BADGE ===== */
    .status-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--green);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1.5px;
      border: 1.5px solid rgba(34, 197, 94, 0.5);
      background: linear-gradient(145deg, rgba(34, 197, 94, 0.15), rgba(34, 197, 94, 0.06));
      padding: 12px 26px;
      border-radius: 50px;
      -webkit-app-region: no-drag;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: dotPulse 2s ease-in-out infinite;
    }
    @keyframes dotPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

    .status-badge.scanning {
      color: var(--accent);
      border-color: rgba(245, 166, 35, 0.5);
      background: linear-gradient(145deg, rgba(245, 166, 35, 0.15), rgba(245, 166, 35, 0.06));
    }
    .status-badge.scanning .status-dot {
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
      animation: dotBlink 0.8s ease-in-out infinite;
    }
    @keyframes dotBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }

    .status-badge.done {
      color: var(--green);
      border-color: rgba(34, 197, 94, 0.5);
      background: linear-gradient(145deg, rgba(34, 197, 94, 0.15), rgba(34, 197, 94, 0.06));
    }
    .status-badge.done .status-dot { animation: none; }

    /* ===== EXIT ===== */
    .exit-badge {
      color: #ef4444;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1.5px;
      border: 1.5px solid rgba(239, 68, 68, 0.5);
      background: linear-gradient(145deg, rgba(239, 68, 68, 0.15), rgba(239, 68, 68, 0.06));
      padding: 12px 26px;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.25s ease;
      -webkit-app-region: no-drag;
      app-region: no-drag;
      pointer-events: all;
    }
    .exit-badge:hover {
      background: linear-gradient(145deg, rgba(239, 68, 68, 0.35), rgba(239, 68, 68, 0.15));
      color: #fff;
      transform: translateY(-2px);
    }

    /* ===== FOOTER ===== */
    .footer {
      padding: 0;
      position: relative;
      z-index: 1;
    }
    .hazard-bar {
      width: 100%;
      height: 6px;
      background: repeating-linear-gradient(
        -45deg,
        var(--hazard-yellow),
        var(--hazard-yellow) 8px,
        var(--hazard-black) 8px,
        var(--hazard-black) 16px
      );
      opacity: 0.7;
    }
    .footer-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      width: 100%;
    }
    .badge {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1.5px;
      padding: 12px 26px;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.25s ease;
      -webkit-app-region: no-drag;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.06);
      backdrop-filter: blur(8px);
    }
    .badge:hover { transform: translateY(-2px); }
    .admin-badge {
      color: var(--green);
      border: 1.5px solid rgba(34, 197, 94, 0.5);
      background: linear-gradient(145deg, rgba(34, 197, 94, 0.15), rgba(34, 197, 94, 0.06));
    }
    .version-badge {
      color: var(--text-dim);
      border: 1.5px solid rgba(255,255,255,0.12);
      background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
    }

    .footer-warning {
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-top">
      <div class="status-badge" id="statusBadge"><span class="status-dot"></span><span id="statusBadgeText">Ready</span></div>
      <button class="exit-badge" id="btnExit">Exit</button>
    </div>
    <div class="logo">
      <img src="assets/icon.png" alt="1132 Fixer">
      <span class="logo-title">1132 FIXER</span>
      <div class="logo-sep"></div>
      <span class="logo-desc">Zoom Database Purge — Total Elimination</span>
    </div>
  </div>

  <div class="main">
    <div class="file-list" id="fileList">
      <div class="file-item loading">Scanning for database files...</div>
    </div>

    <div class="button-container">
      <button id="deleteBtn" class="btn-delete" disabled>DELETE ALL FOUND FILES</button>
      <button id="refreshBtn" class="btn-refresh">Refresh</button>
    </div>

    <p class="footer-warning" style="text-align:center;">Script will NOT exit until files are deleted</p>
  </div>

  <div class="footer">
    <div class="hazard-bar"></div>
    <div class="footer-content">
      <span class="badge version-badge" id="appVersion">v5.1</span>
      <span class="badge admin-badge">Administrator</span>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
